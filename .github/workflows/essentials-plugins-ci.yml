name: Shattered Essentials plugins CI
on:
  push:
    branches: [main]
    paths:
      - 'essentials/**'
      - 'development/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/essentials-plugins-ci.yml'
  pull_request:
    paths:
      - 'essentials/**'
      - 'development/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/essentials-plugins-ci.yml'
  workflow_dispatch:
concurrency:
  group: shattered-plugins-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate queue and plugin version manifest
        run: python3 scripts/validate_integration.py
      - name: Test safe installer and queue
        run: python3 -m unittest discover -s tests -v
      - name: Ruby syntax check
        run: ruby -c 'essentials/Plugins/Shattered Core/001_Core.rb'
      - name: Shattered HUMAN API unit tests
        run: ruby tests/test_shattered_core.rb
      - name: HUMAN equipment and merged Core integration regression
        run: |
          ruby -c 'essentials/Plugins/Shattered Equipment/001_Equipment.rb'
          ruby tests/test_equipment.rb
          ruby tests/test_equipment_core_integration.rb
      - name: Private native RMXP inventory regression (synthetic fixtures only)
        run: |
          ruby -c scripts/audit_native_project.rb
          ruby tests/test_native_project_audit.rb
      - name: Compiled native RXData script syntax audit regression (synthetic fixtures only)
        run: |
          ruby -c scripts/audit_native_script_syntax.rb
          ruby tests/test_native_script_syntax.rb
      - name: Native Viridian escort geometry and collision regression
        run: |
          ruby -c 'essentials/Plugins/Shattered Viridian/001_Entry.rb'
          ruby -c 'essentials/Plugins/Shattered Viridian/002_Install.rb'
          ruby tests/test_viridian.rb
      - name: World-link native installer syntax and unit tests
        run: |
          ruby -c 'essentials/Plugins/Shattered World Links/001_Install.rb'
          ruby tests/test_world_links.rb
      - name: Smoke test staged project output
        run: |
          mkdir -p /tmp/base/PBS
          printf '[Game]\nTitle=Test\n' > /tmp/base/Game.ini
          printf '[PIKACHU]\nName = Pikachu\n' > /tmp/base/PBS/pokemon.txt
          python3 scripts/stage_essentials.py --project /tmp/base --output /tmp/staged
          test -f '/tmp/staged/Plugins/Shattered Core/001_Core.rb'
          grep -q '^\[HUMAN\]' /tmp/staged/PBS/pokemon.txt
