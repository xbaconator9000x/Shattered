name: Shattered hosted runner diagnostic
on:
  push:
    paths:
      - .github/workflows/runner-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Show runner started
        run: |
          echo "Shattered runner allocation succeeded"
          echo "RUN_ID=$GITHUB_RUN_ID"
          python3 --version
