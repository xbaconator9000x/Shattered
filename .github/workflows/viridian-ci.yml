name: Shattered Viridian native escort isolated tests
on:
  pull_request:
    paths:
      - 'essentials/Plugins/Shattered Viridian/**'
      - 'tests/test_viridian.rb'
      - 'tests/test_viridian_map_restore.rb'
      - 'tests/test_private_viridian_center_arrival.rb'
      - 'scripts/repair_private_viridian_center_arrival.rb'
      - 'scripts/upgrade_private_viridian_v013.rb'
      - 'tests/test_upgrade_private_viridian_v013.rb'
      - '.github/workflows/viridian-ci.yml'
permissions:
  contents: read
jobs:
  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Ruby syntax
        run: |
          ruby -c 'essentials/Plugins/Shattered Viridian/001_Entry.rb'
          ruby -c 'essentials/Plugins/Shattered Viridian/002_Install.rb'
          ruby -c scripts/repair_private_viridian_center_arrival.rb
          ruby -c scripts/upgrade_private_viridian_v013.rb
      - name: Saved state and native RMXP installer regression tests
        run: |
          ruby tests/test_viridian.rb
          ruby tests/test_viridian_map_restore.rb
          ruby tests/test_private_viridian_center_arrival.rb
          ruby tests/test_upgrade_private_viridian_v013.rb
