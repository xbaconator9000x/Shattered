name: xx1.08 mGBA boot capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-capture:
    name: Boot the exact private ROM under mGBA
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ROM_NAME: Shattered_xx1.08_crystal_body.gba
      ROM_SHA256: 262ad3fe92e2ec204bc10ad8e39a8eecf9d186472d3eadc7153486da4c7d1e87
    steps:
      - name: Download the private xx1.08 test input
        run: |
          mkdir -p rom evidence
          gh release download xx1.08-crystal-body-test \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ROM_NAME" \
            --dir rom
          echo "$ROM_SHA256  rom/$ROM_NAME" | sha256sum --check --strict

      - name: Install mGBA and the headless X display
        run: |
          sudo apt-get update
          sudo apt-get install --yes mgba-sdl imagemagick xvfb

      - name: Run mGBA and capture its actual display
        run: |
          set -euxo pipefail
          MGBA_BIN="$(command -v mgba-sdl || true)"
          if [ -z "$MGBA_BIN" ] && [ -x /usr/games/mgba-sdl ]; then
            MGBA_BIN=/usr/games/mgba-sdl
          fi
          test -n "$MGBA_BIN"
          Xvfb :99 -screen 0 1024x768x24 >evidence/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          "$MGBA_BIN" -f "rom/$ROM_NAME" >evidence/mgba.log 2>&1 &
          MGBA_PID=$!
          trap 'kill $MGBA_PID $XVFB_PID || true' EXIT
          sleep 8
          kill -0 "$MGBA_PID"
          for n in 1 2 3 4 5 6; do
            import -display :99 -window root "evidence/frame-$n.png"
            sleep 1
          done
          convert -delay 100 -loop 0 evidence/frame-*.png evidence/mgba-boot.gif
          identify evidence/mgba-boot.gif | tee evidence/identify.txt

      - name: Upload the native mGBA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xx1.08-mgba-boot-evidence
          path: evidence/
          if-no-files-found: error
