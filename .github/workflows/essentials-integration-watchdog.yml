name: Shattered Essentials queue watchdog
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: essentials-integration-queue
  cancel-in-progress: false
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate queue
        run: python3 scripts/validate_integration.py
      - name: Create deduplicated ready-task issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/queue_watchdog.py
