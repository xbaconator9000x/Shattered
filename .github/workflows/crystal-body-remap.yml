name: Crystal Body remap contract

on:
  push:
    branches: [feature/xx108-crystal-body-runtime]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pytest development/crystal-body-remap/test_crystal_body_contract.py
