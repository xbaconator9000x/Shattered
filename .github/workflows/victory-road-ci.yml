name: Shattered HGSS Victory Road native import tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/*hns_victory_road*'
      - 'scripts/render_hns_tiles.py'
      - 'scripts/preview_hns_native_maps.py'
      - 'tests/test_preview_hns_native_maps.py'
      - 'scripts/install_hns_gate_victory_road.rb'
      - 'scripts/repair_private_hns_north_warps.rb'
      - 'scripts/verify_private_hns_east_path.rb'
      - 'tests/test_private_hns_north_warps.rb'
      - 'tests/test_private_hns_east_path.rb'
      - 'scripts/convert_hns_reception_gate.py'
      - 'scripts/resolve_hns_gate_warps.py'
      - 'essentials/Plugins/Shattered HnS Gate/001_Import.rb'
      - 'tests/test_hns_gate_conversion.py'
      - 'tests/test_resolve_hns_gate_warps.py'
      - 'tests/test_hns_gate_import.rb'
      - 'tests/test_hns_victory_road*'
      - 'tests/test_render_hns_tiles.py'
      - 'tests/test_hns_private_tilesets.py'
      - 'tests/test_hns_world_install.rb'
      - 'scripts/validate_hns_gate_victory_link.py'
      - 'tests/test_hns_gate_victory_link.py'
      - '.github/workflows/victory-road-ci.yml'
  pull_request:
    paths:
      - 'scripts/*hns_victory_road*'
      - 'scripts/render_hns_tiles.py'
      - 'scripts/preview_hns_native_maps.py'
      - 'tests/test_preview_hns_native_maps.py'
      - 'scripts/install_hns_gate_victory_road.rb'
      - 'scripts/repair_private_hns_north_warps.rb'
      - 'scripts/verify_private_hns_east_path.rb'
      - 'tests/test_private_hns_north_warps.rb'
      - 'tests/test_private_hns_east_path.rb'
      - 'scripts/convert_hns_reception_gate.py'
      - 'scripts/resolve_hns_gate_warps.py'
      - 'essentials/Plugins/Shattered HnS Gate/001_Import.rb'
      - 'tests/test_hns_gate_conversion.py'
      - 'tests/test_resolve_hns_gate_warps.py'
      - 'tests/test_hns_gate_import.rb'
      - 'tests/test_hns_victory_road*'
      - 'tests/test_render_hns_tiles.py'
      - 'tests/test_hns_private_tilesets.py'
      - 'tests/test_hns_world_install.rb'
      - 'scripts/validate_hns_gate_victory_link.py'
      - 'tests/test_hns_gate_victory_link.py'
      - '.github/workflows/victory-road-ci.yml'
  workflow_dispatch:
concurrency:
  group: shattered-victory-road-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for indexed GBA source tile rendering
        run: python3 -m pip install 'Pillow==12.0.0'
      - name: Compile all Victory Road Python modules
        run: |
          python3 -m py_compile scripts/render_hns_tiles.py scripts/preview_hns_native_maps.py scripts/convert_hns_victory_road.py scripts/audit_hns_victory_road.py scripts/convert_hns_reception_gate.py scripts/resolve_hns_gate_warps.py
      - name: Source warp and tile conversion tests (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_hns_victory_road*.py' -v
      - name: GBA 8px indexed tiles to RMXP 32px render tests (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_render_hns_tiles.py' -v
      - name: Four-map private asset review preview tests (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_preview_hns_native_maps.py' -v
      - name: Private PNG preflight tests (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_hns_private_tilesets.py' -v
      - name: Gate-to-B2F reciprocal collision and warp tests (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_hns_gate_victory_link.py' -v
      - name: Reception Gate conversion and native importer regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_hns_gate_conversion.py' -v
          python3 -m unittest discover -s tests -p 'test_resolve_hns_gate_warps.py' -v
          ruby tests/test_hns_gate_import.rb
      - name: Guarded native RMXP importer tests (synthetic Marshal fixtures only)
        run: |
          ruby -c scripts/install_hns_victory_road.rb
          ruby -c scripts/install_hns_gate_victory_road.rb
          ruby tests/test_hns_victory_road_install.rb
          ruby tests/test_hns_world_install.rb
      - name: Native Gate twin north landing repair regression tests
        run: |
          ruby -c scripts/repair_private_hns_north_warps.rb
          ruby tests/test_private_hns_north_warps.rb
      - name: HnS Gate east upper-walkway native directional preflight
        run: |
          ruby -c scripts/verify_private_hns_east_path.rb
          ruby tests/test_private_hns_east_path.rb
