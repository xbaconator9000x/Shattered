name: Shattered Beedrill raid tests
on:
  push:
    paths:
      - 'essentials/Plugins/Shattered Raid/**'
      - 'tests/test_shattered_raid.rb'
      - 'tests/test_raid_core_integration.rb'
      - 'tests/test_private_viridian_beedrill.rb'
      - 'scripts/install_private_viridian_beedrill.rb'
      - 'essentials/Plugins/Shattered Core/**'
      - 'docs/SE-019B_BEEDRILL_RAID.md'
      - '.github/workflows/shattered-raid-ci.yml'
  pull_request:
    paths:
      - 'essentials/Plugins/Shattered Raid/**'
      - 'tests/test_shattered_raid.rb'
      - 'tests/test_raid_core_integration.rb'
      - 'tests/test_private_viridian_beedrill.rb'
      - 'scripts/install_private_viridian_beedrill.rb'
      - 'essentials/Plugins/Shattered Core/**'
      - 'docs/SE-019B_BEEDRILL_RAID.md'
      - '.github/workflows/shattered-raid-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check raid plugin syntax
        run: ruby -c 'essentials/Plugins/Shattered Raid/001_Raid.rb'
      - name: Run isolated raid tests
        run: ruby tests/test_shattered_raid.rb
      - name: Run real-Core raid integration regression
        run: ruby tests/test_raid_core_integration.rb
      - name: Verify native Viridian Beedrill installer (synthetic map only)
        run: |
          ruby -c scripts/install_private_viridian_beedrill.rb
          ruby tests/test_private_viridian_beedrill.rb
