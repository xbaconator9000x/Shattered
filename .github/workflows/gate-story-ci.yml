name: Shattered gate story isolated tests

on:
  pull_request:
    paths:
      - "essentials/Plugins/Shattered Gate Story/**"
      - "essentials/PBS/SHATTEREDGATEKEY.pbs"
      - "scripts/install_gate_key_pbs.py"
      - "scripts/compile_private_gate_key.rb"
      - "tests/test_compile_private_gate_key.rb"
      - "tests/test_gate_story.rb"
      - "scripts/repair_private_hns_gate_key_branch.rb"
      - "tests/test_private_hns_gate_key_branch.rb"
      - "scripts/verify_private_plugin_coherence.rb"
      - "tests/test_private_plugin_coherence.rb"
      - "scripts/upgrade_approved_hns_opening.rb"
      - "tests/test_upgrade_approved_hns_opening.rb"
      - "scripts/repair_private_hns_player_avatar.rb"
      - "tests/test_private_hns_player_avatar.rb"
      - "scripts/install_private_hns_debris.rb"
      - "tests/test_hns_south_debris.rb"
      - "tests/test_hns_debris_state.rb"
      - "scripts/verify_private_hns_east_door.rb"
      - "tests/test_private_hns_east_door.rb"
      - "tests/test_gate_key_pbs.py"
      - ".github/workflows/gate-story-ci.yml"

permissions:
  contents: read

jobs:
  gate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ruby syntax and synthetic native-event tests
        run: |
          ruby -c 'essentials/Plugins/Shattered Gate Story/001_GateStory.rb'
          ruby -c 'essentials/Plugins/Shattered Gate Story/002_Install.rb'
          ruby tests/test_gate_story.rb
          ruby -c scripts/repair_private_hns_gate_key_branch.rb
          ruby tests/test_private_hns_gate_key_branch.rb
          ruby -c scripts/verify_private_plugin_coherence.rb
          ruby tests/test_private_plugin_coherence.rb
          ruby -c scripts/upgrade_approved_hns_opening.rb
          ruby tests/test_upgrade_approved_hns_opening.rb
          ruby -c scripts/repair_private_hns_player_avatar.rb
          ruby tests/test_private_hns_player_avatar.rb
          ruby -c scripts/install_private_hns_debris.rb
          ruby tests/test_hns_south_debris.rb
          ruby tests/test_hns_debris_state.rb
          ruby -c scripts/verify_private_hns_east_door.rb
          ruby tests/test_private_hns_east_door.rb
          ruby -c scripts/compile_private_gate_key.rb
          ruby tests/test_compile_private_gate_key.rb
      - name: Gate key staged PBS tests
        run: python3 -m unittest discover -s tests -p 'test_gate_key_pbs.py' -v
