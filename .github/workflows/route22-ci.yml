name: Shattered Route22 native encounter isolated tests

on:
  pull_request:
    paths:
      - "essentials/Plugins/Shattered Route22/**"
      - "tests/test_route22.rb"
      - "tests/test_route22_map_setup.rb"
      - "tests/test_route22_rattata_group.rb"
      - "scripts/install_private_route22_rattata_sprites.rb"
      - "scripts/upgrade_private_viridian_handoff.rb"
      - "tests/test_private_viridian_handoff.rb"
      - "scripts/upgrade_private_viridian_escort.rb"
      - "tests/test_private_viridian_escort.rb"
      - ".github/workflows/route22-ci.yml"

permissions:
  contents: read

jobs:
  route22:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ruby syntax and native RMXP event / battle state tests
        run: |
          ruby -c 'essentials/Plugins/Shattered Route22/001_Route22.rb'
          ruby -c 'essentials/Plugins/Shattered Route22/002_Install.rb'
          ruby tests/test_route22.rb
          ruby tests/test_route22_map_setup.rb
          ruby -c scripts/install_private_route22_rattata_sprites.rb
          ruby tests/test_route22_rattata_group.rb
          ruby -c scripts/upgrade_private_viridian_handoff.rb
          ruby tests/test_private_viridian_handoff.rb
          ruby -c scripts/upgrade_private_viridian_escort.rb
          ruby tests/test_private_viridian_escort.rb
