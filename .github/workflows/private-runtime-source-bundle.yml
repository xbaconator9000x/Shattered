name: Shattered source-only private runtime handoff

on:
  push:
    paths:
      - '.github/workflows/private-runtime-source-bundle.yml'
      - 'essentials/Plugins/**'
      - 'essentials/PBS/**'
      - 'scripts/**'
      - 'tests/**'
      - 'scripts/build_private_native_candidate.py'
      - 'scripts/stage_essentials.py'
      - 'tests/test_private_native_candidate.py'
      - 'scripts/compile_private_pbs_native.rb'
      - 'scripts/private_rgss_writer.rb'
      - 'scripts/install_private_route22_native.rb'
      - 'essentials/Plugins/Shattered Route22/001_Route22.rb'
      - 'tests/test_route22.rb'
      - 'tests/test_private_native_route22.rb'
      - 'tests/test_private_native_pbs_compile.rb'
      - 'scripts/compile_private_plugins.rb'
      - 'tests/test_private_plugin_compiler.rb'
      - 'scripts/finalize_private_runtime.rb'
      - 'tests/test_private_runtime_isolation.rb'
      - 'scripts/prepare_linux_map_aliases.py'
      - 'tests/test_linux_map_aliases.py'
      - 'scripts/stage_human_battle_sprite.py'
      - 'tests/test_human_battle_sprite.py'
  pull_request:
    paths:
      - 'essentials/Plugins/**'
      - 'essentials/PBS/**'
      - 'scripts/**'
      - 'tests/**'
      - 'scripts/build_private_native_candidate.py'
      - 'tests/test_private_native_candidate.py'
      - 'scripts/stage_essentials.py'
      - 'tests/test_stage.py'
      - 'scripts/finalize_private_runtime.rb'
      - 'tests/test_private_runtime_isolation.rb'
      - 'scripts/prepare_linux_map_aliases.py'
      - 'tests/test_linux_map_aliases.py'
      - 'scripts/stage_human_battle_sprite.py'
      - 'scripts/private_rgss_writer.rb'
      - 'scripts/install_private_route22_native.rb'
      - 'essentials/Plugins/Shattered Route22/001_Route22.rb'
      - 'tests/test_route22.rb'
      - 'tests/test_private_native_route22.rb'
      - 'tests/test_human_battle_sprite.py'
      - '.github/workflows/private-runtime-source-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject assets and unexpected tracked paths before packaging
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          raw = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', 'essentials/Plugins', 'essentials/PBS', 'scripts', 'development', 'tests']
          )
          tracked = [part.decode() for part in raw.split(bytes([0])) if part]
          allowed = {'.rb', '.txt', '.pbs', '.py', '.json', '.md', '.sh'}
          paths, excluded = [], []
          for name in tracked:
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink(), f'unsafe tracked path: {name}'
              if path.suffix.lower() not in allowed:
                  # The private repository can contain unrelated development
                  # reference images. Never copy them into the source handoff.
                  assert path.parts[0] == 'development', f'non-source in runtime code: {name}'
                  excluded.append(name)
                  continue
              assert path.stat().st_size < 2_000_000, f'oversized source file: {name}'
              paths.append(name)
          assert len(paths) > 10, 'source inventory unexpectedly empty'
          pathlib.Path('source-bundle').mkdir(exist_ok=True)
          pathlib.Path('source-bundle/source_paths.json').write_text(json.dumps(paths))
          print(f'Validated {len(paths)} source files; excluded {len(excluded)} development assets')
          for name in excluded:
              print(f'Excluded non-source development reference: {name}')
          PY
      - name: Build exact-commit source-only bundle
        run: |
          python3 - <<'PY'
          import json, subprocess
          paths = json.loads(open('source-bundle/source_paths.json').read())
          subprocess.run(['git', 'archive', '--format=tar.gz',
                          '--output=source-bundle/shattered-source.tar.gz',
                          'HEAD', *paths], check=True)
          PY
          echo "$GITHUB_SHA" > source-bundle/main-or-pr-head.sha
          (cd source-bundle && sha256sum shattered-source.tar.gz > SHA256SUMS)
          tar -tzf source-bundle/shattered-source.tar.gz | grep -Fq 'essentials/Plugins/Shattered Core/001_Core.rb'
          tar -tzf source-bundle/shattered-source.tar.gz | grep -Fq 'development/plugin_manifest.json'
          test ! -e source-bundle/Game.exe
      - uses: actions/upload-artifact@v4
        with:
          name: shattered-source-only-${{ github.sha }}
          path: source-bundle/
          if-no-files-found: error
          retention-days: 2
